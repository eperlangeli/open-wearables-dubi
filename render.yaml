# Render Blueprint for DUBI OpenWearables staging.
# Source of truth: official the-momentum/open-wearables repository.
# This file contains no literal secrets. Set sync:false values manually in Render.

envVarGroups:
  - name: openwearables-staging-shared-secret
    envVars:
      - key: SECRET_KEY
        generateValue: true

services:
  - type: web
    name: openwearables-api-staging
    runtime: docker
    repo: https://github.com/the-momentum/open-wearables.git
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: scripts/start/app.sh
    region: frankfurt
    healthCheckPath: /
    envVars:
      - fromGroup: openwearables-staging-shared-secret
      - key: ENVIRONMENT
        value: staging
      - key: API_PORT
        value: 8000
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: openwearables-postgres-staging
          property: host
      - key: DB_PORT
        fromDatabase:
          name: openwearables-postgres-staging
          property: port
      - key: DB_NAME
        fromDatabase:
          name: openwearables-postgres-staging
          property: database
      - key: DB_USER
        fromDatabase:
          name: openwearables-postgres-staging
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: openwearables-postgres-staging
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: port
      - key: REDIS_DB
        value: 0
      - key: REDIS_SSL
        value: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_DEFAULT_SCOPE
        value: activity:read_all,profile:read_all
      - key: HISTORICAL_SYNC_ON_CONNECT
        value: false
      - key: OUTGOING_WEBHOOKS_ENABLED
        value: false

  - type: worker
    name: openwearables-worker-staging
    runtime: docker
    repo: https://github.com/the-momentum/open-wearables.git
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: scripts/start/worker.sh
    region: frankfurt
    envVars:
      - fromGroup: openwearables-staging-shared-secret
      - key: ENVIRONMENT
        value: staging
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: openwearables-postgres-staging
          property: host
      - key: DB_PORT
        fromDatabase:
          name: openwearables-postgres-staging
          property: port
      - key: DB_NAME
        fromDatabase:
          name: openwearables-postgres-staging
          property: database
      - key: DB_USER
        fromDatabase:
          name: openwearables-postgres-staging
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: openwearables-postgres-staging
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: port
      - key: REDIS_DB
        value: 0
      - key: REDIS_SSL
        value: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_DEFAULT_SCOPE
        value: activity:read_all,profile:read_all
      - key: HISTORICAL_SYNC_ON_CONNECT
        value: false
      - key: OUTGOING_WEBHOOKS_ENABLED
        value: false

  - type: worker
    name: openwearables-beat-staging
    runtime: docker
    repo: https://github.com/the-momentum/open-wearables.git
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: scripts/start/beat.sh
    region: frankfurt
    envVars:
      - fromGroup: openwearables-staging-shared-secret
      - key: ENVIRONMENT
        value: staging
      - key: DB_HOST
        fromDatabase:
          name: openwearables-postgres-staging
          property: host
      - key: DB_PORT
        fromDatabase:
          name: openwearables-postgres-staging
          property: port
      - key: DB_NAME
        fromDatabase:
          name: openwearables-postgres-staging
          property: database
      - key: DB_USER
        fromDatabase:
          name: openwearables-postgres-staging
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: openwearables-postgres-staging
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: openwearables-redis-staging
          property: port
      - key: REDIS_DB
        value: 0
      - key: REDIS_SSL
        value: false

  - type: keyvalue
    name: openwearables-redis-staging
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: openwearables-postgres-staging
    databaseName: openwearables
    user: openwearables
    region: frankfurt
